name: claude-devtools

services:
  devtools:
    build:
      context: .
      secrets:
        - extra_ca
    image: claude-devtools:local
    container_name: claude-devtools
    restart: unless-stopped
    environment:
      # Listen on all interfaces *inside* the container so Docker can forward
      # to it. The port is published on the host's loopback only (below).
      HOST: 0.0.0.0
      PORT: "7878"
      CLAUDE_DIR: /claude
      DATA_DIR: /data
      POLL_INTERVAL_MS: "1000"
      # Raw transcripts are copied into the data volume so history survives
      # Claude Code's periodic cleanup. Set to 0 to keep nothing.
      ARCHIVE: "${ARCHIVE:-1}"
    ports:
      - "127.0.0.1:${DEVTOOLS_PORT:-7878}:7878"
    volumes:
      - "${CLAUDE_HOME:-~/.claude}:/claude:ro"
      - devtools-data:/data
    # No outbound network is needed; the app makes no external calls.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Live-reload development: `docker compose watch dev`, then open
  # http://127.0.0.1:5174. Edits under src/ sync into the container: the server
  # restarts (tsx watch) and the UI hot-reloads (Vite). Dependency or config
  # changes rebuild the image. Only started when named, so a plain `up` still
  # runs the production service alone.
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
      secrets:
        - extra_ca
    image: claude-devtools:dev
    container_name: claude-devtools-dev
    environment:
      POLL_INTERVAL_MS: "1000"
      ARCHIVE: "${ARCHIVE:-1}"
    ports:
      - "127.0.0.1:${DEVTOOLS_DEV_PORT:-5174}:5174"
    volumes:
      - "${CLAUDE_HOME:-~/.claude}:/claude:ro"
      # Separate index: two processes must not share one SQLite file.
      - devtools-dev-data:/data
    # Not read_only: watch syncs files into /app and Vite writes its cache.
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    develop:
      watch:
        - path: ./src
          action: sync
          target: /app/src
        - path: ./vite.config.ts
          action: sync+restart
          target: /app/vite.config.ts
        - path: ./package.json
          action: rebuild
        - path: ./package-lock.json
          action: rebuild
        - path: ./Dockerfile
          action: rebuild

volumes:
  devtools-data:
  devtools-dev-data:

secrets:
  # Only needed behind a TLS-intercepting proxy; see Dockerfile.
  extra_ca:
    file: ${NPM_CA_FILE:-/dev/null}
